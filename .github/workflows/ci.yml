name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --no-default-features

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo test  # default features
      # The benchmarks are not run in CI — the numbers would be meaningless on a shared runner —
      # but they must keep compiling, or they rot into a second, unbuilt copy of the API.
      - run: cargo bench --all-features --no-run

  spec:
    name: spec conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No float may appear in a wire model or in the pricing engine. Reads src/ only.
      - run: cargo run -p xtask -- no-floats
      # Every public configuration field must be read somewhere, not merely assigned. A setting
      # that does nothing is a promise the crate does not keep.
      - run: cargo run -p xtask -- dead-config
      # The specification is not vendored — OCPI is CC BY-ND 4.0 — so CI fetches exactly the
      # commits `spec-sources.toml` pins and verifies every file against `spec-sources.lock`
      # before reading a word of it. Until this existed the three censuses below were skipped on
      # every run, which made a green badge say nothing at all about spec coverage.
      - name: fetch the pinned specification
        run: cargo run -p xtask -- spec-sync --fetch
      - name: the checkout is the one this crate was written against
        run: cargo run -p xtask -- spec-sync --check
      # Every object's fields must still match the specification's own property tables, every
      # enum's values must still match its value table, and every field's cardinality and length
      # must still match its row. A missing enum value makes a conformant peer's object
      # undecodable; a length that is too small reports a conformant value as TooLong and, with
      # outgoing validation on, refuses to send it.
      - name: spec coverage
        run: |
          cargo run -p xtask -- spec-coverage --check
          cargo run -p xtask -- enum-coverage --check
          cargo run -p xtask -- field-shapes --check
      # Every recorded specification defect must still be a defect. An erratum upstream fixes
      # turns a documented workaround into a false claim, and nothing else would notice.
      - name: errata still reproduce
        run: cargo run -p xtask -- errata --check
      # And the URLs this crate builds must still be the ones the specification writes. A URL is
      # where an OCPI integration actually breaks, and no census compares one.
      - name: endpoint URLs
        run: cargo run -p xtask -- endpoints --check
      # Every field of every wire object must reach `Validate`. One that does not is a rule this
      # crate promises and does not keep, and nothing else notices.
      - name: validator coverage
        run: cargo run -p xtask -- validate-coverage --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # Every feature on its own, then every pair of the layer features. A full powerset of
      # sixteen features is 65_536 builds; the pairs catch the missing `cfg` gates that matter.
      - run: cargo hack check --each-feature --no-dev-deps
      - run: |
          cargo hack check --feature-powerset --depth 2 --no-dev-deps \
            --include-features v2_1_1,v2_2_1,v2_3_0,bookings,payments,transport,client,server,hub,convert,tariffs,testkit,schema

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@zola
      - run: zola --root site build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/public

  # Single job for branch protection to depend on.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, spec, msrv, features, docs, deny, site, package]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
