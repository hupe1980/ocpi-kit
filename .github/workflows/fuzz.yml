name: Fuzz

# The crate forbids `unsafe`, so a hostile peer's leverage is a panic — and a panic inside a hub's
# forwarder takes down a task holding somebody else's message. The property tests already assert
# panic-freedom for every parser a peer controls, with *generated values*; this is the same claim
# with *generated bytes*, which is what finds the input no generator would think to build.
#
# Nightly, because libFuzzer needs it. Seeded from the specification's own 279 examples, so the
# run starts from documents that decode instead of rediscovering that OCPI is JSON.
on:
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to run each target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wire, envelope, patch, bridge, pricing, headers]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # `taiki-e/install-action` does not ship a cargo-fuzz manifest. `@cargo-fuzz` resolved to a
      # branch whose `tool` input was never substituted, so the step succeeded and installed
      # nothing — and the job then failed with "no such command: fuzz". Installed properly here;
      # `Swatinem/rust-cache` caches `~/.cargo/bin`, so this compiles once per cache generation.
      - name: install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      - name: seed the corpus from the specification's examples
        run: cargo run -p xtask -- fuzz-corpus
      # A coverage-guided fuzzer that starts from its seeds every night re-finds the same shallow
      # inputs every night. The corpus is restored from the previous run and saved after it, so
      # each night starts where the last one stopped.
      - name: restore the corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: fuzz
        working-directory: fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || 300 }} \
            -print_final_stats=1
      - name: keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
