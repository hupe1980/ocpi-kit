name: Fuzz

# The crate forbids `unsafe`, so a hostile peer's leverage is a panic — and a panic inside a hub's
# forwarder takes down a task holding somebody else's message. The property tests already assert
# panic-freedom for every parser a peer controls, with *generated values*; this is the same claim
# with *generated bytes*, which is what finds the input no generator would think to build.
#
# Nightly, because libFuzzer needs it. Seeded from the specification's own 279 examples, so the
# run starts from documents that decode instead of rediscovering that OCPI is JSON.
on:
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to run each target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wire, envelope, patch, bridge, pricing, headers]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-fuzz
      - name: seed the corpus from the specification's examples
        run: cargo run -p xtask -- fuzz-corpus
      - name: fuzz
        working-directory: fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || 300 }} \
            -print_final_stats=1
      - name: keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
