name: Spec watch

# The OCPI repository edits released branches **in place**, with no version bump. In July 2026 it
# restructured 2.3.0 — moving the Payments module and `Tariff.preauthorize_amount` out of core
# onto a release branch, and Invoice Reconciliation into it — and nothing told anybody. A pin is
# worth nothing without something that notices when upstream moves past it, so this job exists to
# fail loudly once a week.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    name: has the specification moved?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch the pinned commits
        run: cargo run -p xtask -- spec-sync --fetch
      - name: compare each pin with its branch head
        run: |
          cargo run -p xtask -- spec-sync --latest | tee latest.txt
          if grep -q "moved from" latest.txt; then
            echo "::error::a pinned OCPI branch has moved; read the diff above, then update spec-sources.toml and the lock"
            exit 1
          fi
          echo "::notice::every pinned OCPI branch is still at its pinned commit"
